name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma de Android
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web para la app
        run: npm run build:app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: organizador-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
